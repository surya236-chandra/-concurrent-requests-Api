version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. MongoDB Service with Single-Node Replica Set (rs0)
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: heritage-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./init-mongo-rs.sh:/init-mongo-rs.sh:ro
    entrypoint:
      - /bin/bash
      - -c
      - "tr -d '\\r' < /init-mongo-rs.sh > /tmp/run.sh && bash /tmp/run.sh"
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "try { rs.status().ok } catch(e) { 0 }"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - heritage-network

  # ---------------------------------------------------------------------------
  # 2. Express Backend API & Socket.io Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: heritage-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/heritage_booking?replicaSet=rs0
      - JWT_SECRET=heritage_assessment_secret_token_key_change_me_production_987654321
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - heritage-network

  # ---------------------------------------------------------------------------
  # 3. Vite + React Frontend served via Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000/api
        - VITE_SOCKET_URL=http://localhost:3000
    container_name: heritage-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - heritage-network

# -----------------------------------------------------------------------------
# Persistent Volumes & Shared Internal Network
# -----------------------------------------------------------------------------
volumes:
  mongo_data:
    driver: local

networks:
  heritage-network:
    driver: bridge
