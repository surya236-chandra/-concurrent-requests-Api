# mongod-rs.cfg  — local replica set config for development
# Uses port 27018 so it doesn't conflict with the default MongoDB service on 27017

storage:
  dbPath: C:\Assesmentbookingsystem\data\rs0

systemLog:
  destination: file
  logAppend: true
  path: C:\Assesmentbookingsystem\data\rs0\mongod.log

net:
  port: 27018
  bindIp: 127.0.0.1

replication:
  replSetName: "rs0"
  
